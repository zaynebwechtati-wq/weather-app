{% extends "base.html" %}


{% block title %}
Anomalies
{% endblock %}



{% block content %}


<div class="station">


<header class="masthead">

    <p class="eyebrow">
        Anomalies
        <span class="sep">·</span>
        <span class="coords">z-score</span>
    </p>


    <div class="masthead-row">

        <h1>
            Weather Anomalies Detection
        </h1>


        <p class="sync">

            <span class="dot live"></span>

            <span id="anomalies-status">
                Checking...
            </span>

        </p>

    </div>

</header>



<section class="query-panel">


    <div class="field">

        <span class="field-label">
            Metric
        </span>

        <div class="metric-tabs" id="metric-tabs"></div>

    </div>


    <div class="field field--narrow">

        <label class="field-label" for="threshold">
            Threshold
        </label>

        <input
            class="field-input"
            type="number"
            id="threshold"
            min="0.1"
            max="10"
            step="0.1"
            value="2"
        >

    </div>


    <button class="btn" type="button" id="run-anomalies">
        Detect
    </button>


</section>



<div id="anomalies-summary"></div>



<div id="anomalies-data" class="readouts"></div>


</div>


<script src="/static/js/metrics.js?v={{ asset_version }}"></script>
<script src="/static/js/anomalies.js?v={{ asset_version }}"></script>


{% endblock %}
